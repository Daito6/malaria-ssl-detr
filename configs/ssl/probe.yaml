# Cell-level probe without DETR (scripts/probe.py, also the light probe during pretraining).
# Fit on TRAIN crops, evaluate on VAL crops. Test crops only for the final evaluation (probe.py --eval-split test).
base: configs/ssl/data.yaml

probe:
  long_side: 800                 # DETR eval scale
  window: 224
  exclude: [difficult]           # as in the binary mapping
  rbc_per_split: {train: 4000, val: 2000, test: 2000}   # all other classes are kept (test: --eval-split test only)
  seed: 0
  batch_size: 256
  knn: {k: 20, temperature: 0.07}
  linear: {l2: 1.0e-3, max_iter: 500}       # fixed for every encoder (no tuning)
  bootstrap: 1000                # resamples of val images
  low_label: {fractions: [0.01, 0.1, 1.0], seeds: 5}
  stain_shift:                   # stain-shifted probe: fit on CLEAN train crops, eval on shifted VAL crops
    seed: 2024                   # one fixed shift per val image (seed, image id); stronger than SSL augs
    hed_sigma: 0.08              # SSL views: 0.03
    color_jitter: {brightness: 0.3, contrast: 0.3, saturation: 0.3, hue: 0.05}   # SSL views: 0.2/0.2/0.2/0.02
    blur_sigma: [0.5, 1.0]       # mild
    jpeg_quality: [30, 60]       # SSL views: 60-100
  references:
    random_init_seed: 42
    imagenet: vit_small_patch16_224.augreg_in21k_ft_in1k
    dino: vit_small_patch16_224.dino   # self-supervised DINO on ImageNet (phase 5 reference); mean / std from timm
