# Phase 4: ViT-S/16 backbone in DETR, binary. Encoder: SSL joint MAE + InfoNCE (100 epochs, lambda_con 0.2).
# COCO-pretrained transformer / queries / box head; new input projection. The recipe (adapt, lrs,
# warmup, layer-wise decay, stride) is the base default until step 4 selects it on val (b_vit_imagenet).
base: configs/detr/base.yaml
label_mode: binary
model:
  name: vit_detr
  vit:
    init: runs/ssl_joint/checkpoints/encoder_final.pt
train:
  epochs: 40
