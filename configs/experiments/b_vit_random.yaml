# Phase 4: ViT-S/16 backbone in DETR, binary. Encoder: random init (lower bound).
# COCO-pretrained transformer / queries / box head; new input projection. The recipe (adapt, lrs,
# warmup, layer-wise decay, stride) is the base default, selected by step 4 on val (reports/phase4_recipe_summary.md).
base: configs/detr/base.yaml
label_mode: binary
model:
  name: vit_detr
  vit:
    init: random
train:
  epochs: 40
