[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malaria_ssl"
version = "0.1.0"
description = "Self-supervised ViT pretraining + DETR for malaria detection on BBBC041"
requires-python = ">=3.11"
# torch / torchvision are installed separately (CUDA wheels), see requirements.txt
dependencies = [
    "numpy",
    "pandas",
    "pillow",
    "pyyaml",
    "matplotlib",
    "pycocotools",
]

[project.optional-dependencies]
dev = ["pytest", "nbconvert", "nbformat", "ipykernel", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
